# pimonitor monitoring stack (Prometheus, Grafana, Alertmanager, blackbox,
# node_exporter). Deployed as /home/pi/monitoring/docker-compose.yml: the
# relative paths below are the config directories next to it.
#
# Runs with Debian's docker-compose 1.29 (bookworm) and with `docker compose` v2.
#   cd /home/pi/monitoring && sudo docker-compose up -d
#
# Images use the floating `latest` tag: the Monday updater
# (docker-updates/pimonitor.json) pulls, recreates, health-checks and rolls
# back on failure. Grafana's volume is backed up first and restored on rollback.
#
# Data lives in pre-existing volumes (external): recreating containers keeps it.
version: "2.4"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [monitoring]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "9003:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring]

  # No published port: only Prometheus (same network) talks to it.
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks: [monitoring]

  # No published port: Prometheus scrapes it as blackbox:9115.
  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    restart: always
    command:
      - --config.file=/config/blackbox.yml
    volumes:
      - ./blackbox:/config:ro
    networks: [monitoring]

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    restart: always
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/var/lib/node_exporter/textfile_collector
    volumes:
      - /:/host:ro,rslave

networks:
  monitoring:
    external: true
    name: monitoring

volumes:
  # Prometheus TSDB. New install: `docker volume create prometheus-data`.
  # Existing data in another volume (e.g. the anonymous one an old `docker run`
  # created): set PROMETHEUS_VOLUME=<name> in the .env next to this file.
  prometheus-data:
    external: true
    name: ${PROMETHEUS_VOLUME:-prometheus-data}
  grafana-data:
    external: true
    name: grafana-data
  alertmanager-data:
    external: true
    name: alertmanager-data
