# blackbox_exporter modules for the home service probes (pimonitor).
# Runs on the internal Docker network `monitoring`, publishes no port;
# Prometheus scrapes it as blackbox:9115. Probe targets come from
# prometheus/servicios/*.yml (generated by grafana/build_dashboard.py).
modules:
  # Web UI / API answering 2xx or a redirect (redirects are not followed, so a
  # login redirect still counts as "the service is up").
  http_up:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200, 204, 301, 302, 303, 307, 308]

  # Same, for endpoints that answer 401/403 until you log in.
  http_auth:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200, 204, 301, 302, 303, 307, 308, 401, 403]

  # LAN HTTPS with a self-signed certificate (e.g. Nextcloud on its own IP):
  # checks the service, not the certificate.
  https_lan:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200, 204, 301, 302, 303, 307, 308, 401, 403]
      tls_config:
        insecure_skip_verify: true

  # Public URL through the reverse proxy: the certificate MUST be valid, and
  # probe_ssl_earliest_cert_expiry tells how long it has left.
  https_public:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      fail_if_not_ssl: true
      valid_status_codes: [200, 204, 301, 302, 303, 307, 308, 401, 403]

  tcp_open:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4

  # Pi-hole answering DNS queries.
  dns_resolve:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: udp
      preferred_ip_protocol: ip4
      query_name: example.com
      query_type: A
      valid_rcodes: [NOERROR]
